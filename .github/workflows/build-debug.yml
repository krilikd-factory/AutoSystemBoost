name: ASB · Build Debug

on:
  workflow_dispatch:

# Debug only ever uploads an artifact, so read is all it needs - declared explicitly so
# the job does not silently inherit whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    name: Debug (full diagnostics)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required source files
        run: |
          for f in \
            src/asb_governor.c \
            src/asb_metrics.h \
            src/asb_fsm.h \
            src/asb_learner.h \
            src/asb_writer.h \
            src/asb_socket.h \
            src/asb_config.h \
            src/asb_fsm_bounds.generated.h \
            src/asb_smart.h \
            src/asb_smart_defs.h \
            src/build_ndk_release.sh \
            src/DSP/asb_dsp.c \
            src/DSP/asb_effect_abi.h \
            module.prop \
            customize.sh \
            service.sh; do
            if [ ! -f "$f" ]; then
              echo "ERROR: required file missing: $f"
              exit 1
            fi
            echo "  v $f"
          done

      - name: Validate profile bounds source-of-truth
        run: |
          cp config/profile_bounds.generated.sh /tmp/_bounds_sh.before 2>/dev/null || true
          cp src/asb_fsm_bounds.generated.h    /tmp/_bounds_h.before  2>/dev/null || true
          bash tools/gen_bounds.sh
          if ! diff -q /tmp/_bounds_sh.before config/profile_bounds.generated.sh >/dev/null 2>&1 \
            || ! diff -q /tmp/_bounds_h.before src/asb_fsm_bounds.generated.h >/dev/null 2>&1; then
            echo "ERROR: generated bounds files are STALE"
            echo "       Run 'bash tools/gen_bounds.sh' locally and commit."
            exit 1
          fi
          echo "Generated bounds artefacts up-to-date."

      - name: Run asb_lint.sh
        run: |
          if [ ! -f tools/asb_lint.sh ]; then
            echo "WARNING: tools/asb_lint.sh missing — skipping"
            exit 0
          fi
          MODDIR="$(pwd)" bash tools/asb_lint.sh

      - name: Run unit tests (smart learner)
        run: |
          # 332 host-side unit tests covering the smart learner: weights, decay,
          # confidence, blend math, night override, thermal veto, bucket learning,
          # slot gating and the persistence round-trip. They were sitting in the repo
          # green but unwired, so nothing actually guarded that math on a release.
          # They need no NDK and no device - plain gcc against src/.
          _rc=0
          for _t in tests/test_smart_session2.sh tests/test_smart_session3.sh; do
            [ -f "$_t" ] || { echo "WARNING: $_t missing - skipping"; continue; }
            echo "== $_t =="
            bash "$_t" || _rc=1
          done
          if [ "$_rc" != "0" ]; then
            echo "::error::smart learner unit tests FAILED - refusing to build a release"
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip unzip curl file rsync

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r28c
          key: android-ndk-r28c

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -L --retry 3 --retry-delay 5 \
            -o android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk.zip
          rm -f android-ndk.zip

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r28c" >> $GITHUB_ENV
          echo "NDK_ROOT=$PWD/android-ndk-r28c"         >> $GITHUB_ENV

      - name: Patch module.prop
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if echo "$TAG" | grep -qE '^v[0-9]'; then
            sed -i "s/^version=.*/version=${TAG}/" module.prop
          fi
          cat module.prop

      - name: Normalize DSP source path for Linux CI
        run: |
          if [ -d src/DSP ] && [ ! -e src/dsp ]; then
            ln -s DSP src/dsp
          fi
          test -f src/dsp/asb_dsp.c || { echo "ERROR: src/dsp/asb_dsp.c not found after normalization"; exit 1; }
          test -f src/dsp/asb_effect_abi.h || { echo "ERROR: src/dsp/asb_effect_abi.h not found after normalization"; exit 1; }
          ls -la src/dsp

      - name: Check AIDL prebuilt presence
        run: |
          # Make it obvious in the log whether the soong-built AIDL effect is present.
          # If it is missing, build_ndk_release.sh silently falls back to the LEGACY
          # effect, which Android 13+/16 never loads - that is easy to miss otherwise.
          echo "=== src/DSP_AIDL/prebuilt ==="
          ls -laR src/DSP_AIDL/prebuilt 2>/dev/null || echo "  (prebuilt dir missing)"
          for a in arm64-v8a armeabi-v7a; do
            # Either name counts. build_ndk_release.sh prefers the versioned prebuilts and
            # falls back to the historical libasbdsp_aidl.so, so warning about the old name
            # when libasbdsp_v3.so is sitting right beside it would be a false alarm.
            p=""
            for _c in src/DSP_AIDL/prebuilt/$a/libasbdsp_v*.so \
                      src/DSP_AIDL/prebuilt/$a/libasbdsp_aidl.so; do
              case "$_c" in *_legacy*) continue ;; esac
              [ -f "$_c" ] && { p="$_c"; break; }
            done
            if [ -n "$p" ]; then
              echo "  FOUND $p ($(wc -c < "$p") bytes)"
            else
              echo "  ::warning::no AIDL prebuilt for $a (looked for libasbdsp_v*.so and libasbdsp_aidl.so) - falls back to the LEGACY effect"
            fi
          done

      - name: Build DEBUG binary (full diagnostics)
        run: ASB_BUILD_MODE=debug bash src/build_ndk_release.sh

      - name: Verify debug binary and DSP library
        run: |
          B="bin/arm64-v8a/asb-debug"
          SO="bin/arm64-v8a/libasbdsp.so"

          test -f "$B" || { echo "ERROR: $B not found"; exit 1; }
          test -x "$B" || { echo "ERROR: $B not executable"; exit 1; }
          FILE_OUT="$(file "$B")"
          echo "$B file: $FILE_OUT"
          echo "$FILE_OUT" | grep -q "aarch64"          || { echo "ERROR: not aarch64!"; exit 1; }
          echo "$FILE_OUT" | grep -q "ELF"              || { echo "ERROR: not ELF!"; exit 1; }
          echo "$FILE_OUT" | grep -q "Android\|dynamic" || { echo "ERROR: not Android binary!"; exit 1; }
          SIZE=$(wc -c < "$B")
          echo "Binary size: $SIZE bytes"
          [ "$SIZE" -gt 10000 ]   || { echo "ERROR: too small"; exit 1; }
          [ "$SIZE" -lt 2000000 ] || { echo "ERROR: too large"; exit 1; }

          test -f "$SO" || { echo "ERROR: $SO not found"; exit 1; }
          # Debug builds are what testers flash to diagnose problems, so they need the
          # SAME verification as release - this step used to check only the 64-bit
          # library, which is how a build with no 32-bit effect at all could pass CI.
          SO32="bin/armeabi-v7a/libasbdsp.so"
          if [ -f "$SO32" ]; then
            F32="$(file "$SO32")"; echo "$SO32 file: $F32"
            echo "$F32" | grep -q "ARM"  || { echo "ERROR: $SO32 is not 32-bit ARM!"; exit 1; }
            echo "$F32" | grep -q "ELF"  || { echo "ERROR: $SO32 not ELF!"; exit 1; }
          else
            echo "::error::$SO32 missing - the armeabi-v7a build did not run"
            exit 1
          fi
          FILE_SO="$(file "$SO")"
          echo "$SO file: $FILE_SO"
          echo "$FILE_SO" | grep -q "aarch64" || { echo "ERROR: DSP .so is not aarch64!"; exit 1; }
          echo "$FILE_SO" | grep -q "ELF"     || { echo "ERROR: DSP .so is not ELF!"; exit 1; }
          echo "$FILE_SO" | grep -q "shared object" || { echo "ERROR: DSP artifact is not a shared object!"; exit 1; }
          SO_SIZE=$(wc -c < "$SO")
          echo "DSP size: $SO_SIZE bytes"
          [ "$SO_SIZE" -gt 1000 ] || { echo "ERROR: DSP .so too small"; exit 1; }

          # Report which effect ABI actually shipped. On Android 13+/16 audioserver loads
          # effects through the AIDL factory (createEffect); a legacy AELI-only .so is
          # never bound to the stream. A debug build that cannot bind its own effect is
          # the worst possible one to hand a tester chasing an audio bug.
          if command -v llvm-nm >/dev/null 2>&1; then NM=llvm-nm; else NM="$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-nm 2>/dev/null | head -1)"; fi
          [ -n "$NM" ] && [ -x "$NM" ] || NM=nm
          for so in "$SO" "$SO32"; do
            [ -f "$so" ] || continue
            SYMS="$("$NM" -D --defined-only "$so" 2>/dev/null || true)"
            if echo "$SYMS" | grep -q " createEffect$"; then
              echo "::notice::$so is the AIDL effect (createEffect present) - loads on Android 13+/16"
            elif echo "$SYMS" | grep -q "AUDIO_EFFECT_LIBRARY_INFO_SYM"; then
              echo "::warning::$so is the LEGACY effect (AELI only). Android 13+/16 will NOT bind it to the music stream."
            else
              echo "::warning::$so exports neither createEffect nor AELI - effect will not load"
            fi
          done

      - name: Package DEBUG zip
        run: |
          PKG_DBG="$PWD/pkg-debug"
          rm -rf "$PKG_DBG"
          mkdir -p "$PKG_DBG"

          rsync -a ./ "$PKG_DBG"/ \
            --exclude '.git'                          \
            --exclude '.github'                       \
            --exclude 'android-ndk*'                  \
            --exclude 'pkg-*'                        \
            --exclude '*.zip'                         \
            --exclude '__MACOSX'                      \
            --exclude '*.DS_Store'                    \
            --exclude '__pycache__'                   \
            --exclude '*.pyc'                         \
            --exclude 'src'                           \
            --exclude 'bin/arm64-v8a'                 \
            --exclude 'bin/armeabi-v7a'               \
            --exclude 'banner.png'                    \
            --exclude 'banner2.png'                   \
            --exclude 'CHANGELOG.md'                  \
            --exclude 'README.md'                     \
            --exclude 'README.ru.md'                  \
            --exclude 'update.json'                   \
            --exclude 'RELEASE_CHECKLIST.md'          \
            --exclude 'docs'                          \
            --exclude 'tests'                         \
            --exclude 'tools/gen_bounds.sh'           \
            --exclude 'config/profile_bounds.conf'

          mkdir -p "$PKG_DBG/bin"
          install -m 0755 bin/arm64-v8a/asb-debug "$PKG_DBG/bin/asb"
          # Both ABIs: /vendor/lib64/soundfx and /vendor/lib/soundfx both exist on the
          # target and each needs a library of its own bitness. This step used to ship
          # only the 64-bit one, so debug builds silently had no 32-bit effect at all.
          # The generic slot, ONLY when there is no versioned build to stand in for it.
          #
          # build_ndk_release.sh now resolves bin/arm64-v8a/libasbdsp.so from the newest
          # versioned prebuilt, so shipping both means shipping the same bytes twice under
          # two names - 664 KB of duplicate in a 2 MB module. The installer's fallback
          # already walks libasbdsp_v*.so and takes the newest, so the generic name is only
          # needed by a build that ships no versioned libraries at all.
          if ls src/DSP_AIDL/prebuilt/arm64-v8a/libasbdsp_v*.so >/dev/null 2>&1; then
            echo "  = skipping generic bin/libasbdsp.so (versioned builds cover it)"
          else
            install -m 0644 bin/arm64-v8a/libasbdsp.so "$PKG_DBG/bin/libasbdsp.so"
          fi
          # Versioned AIDL builds, when the repo carries them. The installer reads the
          # effect interface version out of VINTF and asks for the matching one; a device
          # on v2 cannot load a v3 library, so shipping only one is a coin flip.
          for _vs in src/DSP_AIDL/prebuilt/arm64-v8a/libasbdsp_v*.so; do
            [ -f "$_vs" ] || continue
            install -m 0644 "$_vs" "$PKG_DBG/bin/$(basename "$_vs")"
            echo "  + bin/$(basename "$_vs")"
          done
          for _vs in src/DSP_AIDL/prebuilt/armeabi-v7a/libasbdsp_v*.so; do
            [ -f "$_vs" ] || continue
            _vn="$(basename "$_vs" .so)_32.so"
            install -m 0644 "$_vs" "$PKG_DBG/bin/$_vn"
            echo "  + bin/$_vn"
          done
          # Both effect ABIs travel in the zip; common/install.sh stages whichever one
          # this device's effect factory can actually load. Shipping a single variant
          # made that a build-time coin flip - see the OP13 NO_INIT report.
          for _v in "arm64-v8a:libasbdsp_legacy.so" "armeabi-v7a:libasbdsp_legacy_32.so"; do
            _va="${_v%%:*}"; _vn="${_v#*:}"
            if [ -f "bin/$_va/libasbdsp_legacy.so" ]; then
              install -m 0644 "bin/$_va/libasbdsp_legacy.so" "$PKG_DBG/bin/$_vn"
              echo "  + bin/$_vn"
            else
              echo "::warning::bin/$_va/libasbdsp_legacy.so missing - that ABI has no legacy fallback"
            fi
          done
          # Attacher daemon: creates the effect on session 0. OxygenOS ignores the
          # config <postprocess>, so without this the effect never gets instantiated.
          if [ -f bin/arm64-v8a/asb_dsp_attach ]; then
            install -m 0755 bin/arm64-v8a/asb_dsp_attach "${PKG_DBG}/bin/asb_dsp_attach"
          else
            echo "::warning::asb_dsp_attach missing - DSP will register but not attach"
          fi
          if [ -f bin/armeabi-v7a/libasbdsp.so ]; then
            if ls src/DSP_AIDL/prebuilt/armeabi-v7a/libasbdsp_v*.so >/dev/null 2>&1; then
              echo "  = skipping generic bin/libasbdsp_32.so (versioned builds cover it)"
            else
              install -m 0644 bin/armeabi-v7a/libasbdsp.so "$PKG_DBG/bin/libasbdsp_32.so"
            fi
          else
            # Hard failure, exactly as in the release workflow. The only on-device
            # symptom is /vendor/lib/soundfx quietly never appearing, which is precisely
            # how this shipped broken once already - a warning nobody reads is not a gate.
            echo "::error::armeabi-v7a libasbdsp.so was NOT built - check the DSP build step above"
            exit 1
          fi
          find "$PKG_DBG" -name "*.log" -delete

          ASB_VER=$(grep '^version=' module.prop | cut -d= -f2)
          ZIP_DBG="ASB-${ASB_VER}-debug.zip"
          rm -f "$ZIP_DBG"
          ( cd "$PKG_DBG" && zip -rq "../$ZIP_DBG" . -x "*.DS_Store" )
          echo "ZIP_DBG=$ZIP_DBG" >> $GITHUB_ENV
          echo "ASB_VER=$ASB_VER" >> $GITHUB_ENV
          echo "Created: $ZIP_DBG ($(du -sh $ZIP_DBG | cut -f1))"

      - name: Validate DEBUG zip
        run: |
          echo "=== Zip contents ==="
          unzip -l "$ZIP_DBG"

          for required in \
            "bin/asb" \
            "service.sh" \
            "module.prop" \
            "post-fs-data.sh" \
            "apply_profile.sh" \
            "action.sh" \
            "uninstall.sh" \
            "customize.sh" \
            "features.conf" \
            "runtime/asb_watchdog.sh" \
            "runtime/asb_reconcile.sh" \
            "runtime/profile_core.sh" \
            "runtime/asb_baseline.sh" \
            "runtime/asb_utils.sh" \
            "runtime/asb_audio_apply.sh" \
            "runtime/asb_volume_curves.sh" \
            "runtime/asb_media_apply.sh" \
            "runtime/asb_blur_apply.sh" \
            "runtime/asb_lpm.sh" \
            "runtime/asb_dsp_abi_apply.sh" \
            "runtime/asb_haptics_apply.sh" \
            "runtime/asb_camera_grade.sh" \
            "profiles/battery.sh" \
            "profiles/balanced.sh" \
            "profiles/performance.sh" \
            "config/profile_bounds.generated.sh" \
            "config/governor.conf.shipped" \
            "bin/libasbdsp_legacy.so" \
            "bin/libasbdsp_legacy_32.so" \
            "webroot/index.html" \
            "tools/asb_lint.sh" \
            "tools/asb_field_report.py" \
            "tools/asb_field_report.sh" \
            "tools/logkit/_asb_logkit_common.sh" \
            "tools/logkit/asb_audio_ab.sh" \
            "tools/logkit/asb_log_battery_mixed.sh" \
            "tools/logkit/asb_log_battery_sleep.sh" \
            "tools/logkit/asb_log_perf.sh" \
            "tools/logkit/asb_log_bgtrim_snapshot.sh" \
            "tools/logkit/asb_log_smart_daily.sh" \
            "tools/logkit/asb_log_smart_gaming.sh" \
            "tools/logkit/asb_log_smart_sleep.sh" \
            "tools/logkit/asb_log_full_day.sh" \
            "tools/asb_state_sampler.sh" \
            "tools/asb_drain_analyzer.sh" \
            "tools/asb_session_report.py" \
            "tools/asb_smart_mode.sh" \
            "tools/asb_discover.sh" \
            "tools/asb_synthesize_bounds.sh" \
            "tools/asb_vendor_thermal_probe.sh" \
            "tools/asb_diag.sh" \
            "tools/asb_install_probe.sh" \
            "tools/asb_doctor.sh" \
            "tools/asb_audit_state.sh" \
            "tools/asb_verify_device.sh" \
            "tools/asb_compare_sessions.py" \
            "tools/asb_analyze.py"; do
            unzip -l "$ZIP_DBG" | grep -q "$required" \
              || { echo "ERROR: $ZIP_DBG missing $required"; exit 1; }
          done

          # An AIDL library of each bitness has to be in there under SOME name. Listing
          # bin/libasbdsp.so by name stopped working once the generic copy was dropped in
          # favour of the versioned ones - and a required-file list that names a file the
          # packaging step deliberately skips fails every build for no reason.
          for _bits in "" "_32"; do
            if ! unzip -l "$ZIP_DBG" 2>/dev/null | grep -qE "bin/libasbdsp(_v[0-9]+)?${_bits}\.so"; then
              echo "::error::no AIDL effect library for ${_bits:-64-bit} in the package"
              exit 1
            fi
          done

          for forbidden in \
            "bin/arm64-v8a" \
            "android-ndk" \
            "src/asb_governor.c" \
            "tools/gen_bounds.sh"; do
            if unzip -l "$ZIP_DBG" | grep -qE "$forbidden"; then
              echo "ERROR: $ZIP_DBG leaked $forbidden"
              exit 1
            fi
          done
          echo "DEBUG zip validation passed"

      # Directory, not zip - see the matching note in build-release.yml. A tester chasing
      # a bug should be able to flash the download, not unpack it first.
      - name: Upload debug artifact (flashable, not double-zipped)
        uses: actions/upload-artifact@v4
        with:
          name: ASB-${{ env.ASB_VER }}-debug
          path: pkg-debug/
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "  ASB Debug Build Summary"
          echo "========================================"
          echo "  Trigger : ${{ github.event_name }}"
          echo "  Version : ${ASB_VER:-unknown}"
          if [ -f "${ZIP_DBG:-}" ]; then
            echo "  ZIP     : $ZIP_DBG ($(du -sh $ZIP_DBG | cut -f1))"
            BINSZ=$(unzip -p "$ZIP_DBG" bin/asb 2>/dev/null | wc -c)
            SOSZ=$(unzip -p "$ZIP_DBG" bin/libasbdsp.so 2>/dev/null | wc -c)
            echo "  Binary  : ${BINSZ} bytes (with debug logs)"
            echo "  DSP .so : ${SOSZ} bytes"
          fi
          echo "========================================"
