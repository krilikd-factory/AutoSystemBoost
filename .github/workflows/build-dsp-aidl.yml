name: Build DSP AIDL (.so)

# Builds libasbdsp_aidl.so (arm64-v8a + armeabi-v7a) from src/DSP_AIDL/Android.bp in a
# minimal AOSP/soong tree, then uploads the .so files as artifacts.
#
# HONEST EXPECTATIONS:
#  - GitHub-hosted runners do NOT ship an AOSP/soong environment; this workflow builds
#    one from scratch by syncing a minimal set of AOSP projects (see
#    src/DSP_AIDL/manifest/asb_aidl_min.xml). First runs commonly fail on a missing soong
#    module - add the project that provides it to that manifest and re-run. Budget a few
#    iterations; this is normal for a from-scratch soong bring-up.
#  - Disk is the tightest constraint. The free ubuntu runner has ~14 GB free by default;
#    the cleanup step below reclaims ~25-30 GB more. A minimal audio-effect-AIDL tree plus
#    the clang toolchain and out/ is on the edge of fitting. If you hit "no space left on
#    device", switch `runs-on` to a larger runner (e.g. ubuntu-latg / a 2x-large runner in
#    your plan) or a self-hosted runner with 120 GB+ free.
#  - Runtime: a cold sync + soong bootstrap + build is typically 40-90 min.
#
# Trigger manually (workflow_dispatch) so it never runs on every push.

on:
  workflow_dispatch:
    inputs:
      aosp_tag:
        description: "AOSP branch/tag (must match the manifest revision)"
        default: "android16-release"
        required: true
      pre_prune:
        description: "empty Android.bp in irrelevant trees before building (off = known-good path)"
        default: "false"
      lunch_target:
        description: "lunch combo (arm64 primary; compile_multilib both gives arm too)"
        default: "aosp_cf_arm64_only_phone-trunk_stable-userdebug"
        required: true

permissions:
  contents: read

jobs:
  build:
    # Larger runner: the soong "generating ninja" phase loads the whole Android 16 blueprint
    # graph into RAM and does not fit in the 16 GB standard runner (OOM-killed every run). An
    # 8-core larger runner has 32 GB RAM, which clears that phase. The label below must match
    # the larger runner you create in org settings (Settings -> Actions -> Runners -> New
    # GitHub-hosted runner, 8-core Ubuntu). Override via an ASB_RUNNER_LABEL repo/org variable
    # if you name it differently.
    # Larger runner via GitHub's BUILT-IN automatic larger-runner label, not a manually
    # created runner. A hand-created runner ("ubuntu-latest-8-cores") sat Queued 20+ min and
    # never picked up the job - a known larger-runner provisioning issue. GitHub auto-creates
    # a "Default Larger Runners" group; jobs routed to the built-in ubuntu-22.04-8core label
    # (8 vCPU / 32 GB RAM) are provisioned automatically without a UI-created runner. Override
    # with an ASB_RUNNER_LABEL repo/org variable if your org uses a different label.
    runs-on: ${{ vars.ASB_RUNNER_LABEL || 'ubuntu-22.04-8core' }}
    timeout-minutes: 180

    steps:
      - name: Runner check (cores / RAM / label)
        run: |
          # If this prints, the larger runner actually provisioned and picked up the job -
          # so any hang is later, not provisioning. If the job stays Queued and this never
          # prints, the runner never started (GitHub provisioning stall), and the workflow
          # itself is fine. Also confirms we really got 8 cores / ~32 GB, not a fallback.
          echo "=== runner is up ==="
          echo "hostname: $(hostname)"
          echo "cores (nproc): $(nproc)"
          echo "runner label requested: ${{ vars.ASB_RUNNER_LABEL || 'ubuntu-22.04-8core' }}"
          free -h || true
          echo "disk:"; df -h / || true
          echo "=== expecting ~8 cores and ~32 GB RAM for the DSP build ==="

      - name: Checkout module sources (shallow)
        uses: actions/checkout@v4
        with:
          path: asb-src

      - name: Reclaim disk space
        run: |
          echo "Before:"; df -h /
          # The full (shallow) AOSP manifest is larger than the old minimal set, so reclaim
          # aggressively up front. These preinstalled toolchains are ~30 GB combined and are
          # not needed for a soong build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/lib/node_modules /usr/share/swift \
                      /opt/hostedtoolcache /usr/local/graalvm /usr/local/.ghcup \
                      /usr/lib/jvm /usr/local/share/powershell 2>/dev/null || true
          sudo apt-get -y purge '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli \
                      google-chrome-stable firefox powershell mono-devel \
                      '^mysql-.*' '^postgresql-.*' 2>/dev/null || true
          sudo apt-get -y autoremove --purge 2>/dev/null || true
          sudo apt-get clean
          docker rmi $(docker images -q) 2>/dev/null || true
          echo "After:"; df -h /

      - name: Install AOSP build dependencies
        run: |
          sudo apt-get update
          # Core deps that exist on every Ubuntu. Note: libncurses5 was RENAMED on Ubuntu
          # 24.04 (noble) - the runner's default image - so requesting it aborts apt with
          # "Unable to locate package". Use the current names (libncurses6 / libncurses-dev)
          # here, and try the legacy libncurses5/libtinfo5 separately WITHOUT failing the
          # step, since only some AOSP prebuilt host tools need the old soname.
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses6 libncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip ccache rsync
          # Legacy ncurses5 soname for older prebuilt tools; ignore if unavailable on noble.
          sudo apt-get install -y --no-install-recommends libncurses5 libtinfo5 2>/dev/null \
            || echo "libncurses5/libtinfo5 not available on this release - continuing (usually fine)"
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.name  "asb-ci"
          git config --global user.email "asb-ci@users.noreply.github.com"
          git config --global color.ui false

      - name: Init AOSP tree (standard manifest, filtered)
        run: |
          mkdir -p aosp && cd aosp
          # Standard manifest so soong resolves its own deps, with a CONSERVATIVE groups
          # filter. Only drop things a single vendor-lib build never needs: the big test
          # suites (cts/vts) and other-OS host tools (darwin/mips). Do NOT exclude -pdk or
          # -notdefault: build/make itself is tagged groups="pdk,sysui-studio", so excluding
          # pdk silently drops the build system (the "build/make missing" failure). The
          # previous full sync was 120 GB; dropping just cts/vts brought it to ~18 GB with
          # 108 GB free, so disk is no longer the constraint and we keep build/make.
          # Groups filter: only exclude the big STANDALONE test suites (cts/vts) and
          # other-OS host tools (darwin/mips). Do NOT exclude broadly - the soong bootstrap
          # parses every Android.bp in the tree, and hardware/interfaces references modules
          # like kernel-config-soong-rules (in kernel/configs), so an over-filtered tree
          # breaks bootstrap on "undefined module". Keeping the filter narrow keeps those
          # referenced projects present.
          # No --clone-filter=blob:limit: with it, referenced projects (kernel/configs)
          # synced without their Android.bp, so soong still saw "undefined module". Full
          # blobs (still --depth=1) guarantee every Android.bp is present.
          # Groups: --groups=all pulled EVERY subtree (trusty, apps, wear, rust...), and each
          # one whose Android.bp had an unmet dep failed ninja generation one at a time. So
          # exclude the big unrelated subtrees at the source. Keep kernel (for
          # kernel-config-soong-rules) and device (cuttlefish product). If a later "missing
          # dependency" still names a subtree, add -<group> here or rm -rf it in prune.
          repo init -u https://android.googlesource.com/platform/manifest \
                    -b "${{ github.event.inputs.aosp_tag }}" \
                    --depth=1 \
                    --groups=default,kernel,device,-cts,-vts,-vts10,-darwin,-apps,-trusty
          echo "=== manifest ready ==="

      - name: Sync AOSP tree
        working-directory: aosp
        run: |
          # googlesource returned HTTP 429 (Too Many Requests): 8 parallel fetches after many
          # repeated syncs over these days tripped its rate limiter. Fix: fewer parallel
          # connections, retries with growing backoff, and NO --fail-fast so one throttled
          # project does not abort everything. repo sync resumes already-fetched projects, so
          # each retry only pulls what is still missing - cheap and self-healing.
          sync_once() {
            repo sync -c --no-tags --no-clone-bundle --optimized-fetch --force-sync -j"$1"
          }
          ok=0
          # Start gentle (fewer connections = less likely to be throttled), and back off on
          # failure. Pause between attempts so the rate-limit window resets.
          for attempt in 1 2 3 4 5; do
            case $attempt in
              1) J=4 ;; 2) J=3 ;; 3) J=2 ;; *) J=1 ;;
            esac
            echo "=== sync attempt $attempt (-j$J) ==="
            if sync_once "$J"; then ok=1; break; fi
            echo "sync attempt $attempt failed (likely HTTP 429 rate-limit); backing off..."
            sleep $(( attempt * 60 ))
          done
          [ "$ok" = "1" ] || { echo "::error::repo sync failed after retries (rate-limited?)"; exit 1; }
          echo "Tree size after sync:"; du -sh . 2>/dev/null || true
          df -h /
          test -f build/make/envsetup.sh \
            || { echo "::error::build/make missing after sync"; exit 1; }
          echo "=== pruning other-OS toolchains ==="
          sudo rm -rf \
            prebuilts/clang/host/darwin-x86 prebuilts/clang/host/windows-x86 \
            prebuilts/build-tools/darwin-x86 prebuilts/go/darwin-x86 \
            prebuilts/jdk/jdk*/darwin-x86 prebuilts/jdk/jdk*/windows-x86 \
            prebuilts/misc/darwin-x86 prebuilts/misc/windows-x86 2>/dev/null || true
          # Reclaim big space by dropping git history/objects: the working tree is checked
          # out, and a one-shot build never needs .git. On a full-blob shallow sync this
          # frees tens of GB, which keeps out/ from running out of space.
          echo "=== stripping .git to reclaim space ==="
          du -sh .repo/project-objects .repo/projects 2>/dev/null | head -3 || true
          find . -path ./.repo -prune -o -type d -name '.git' -print 2>/dev/null | while read -r g; do
            rm -rf "$g" 2>/dev/null || true
          done
          # .repo holds the real git objects for a repo checkout; after sync we can drop the
          # large pack objects too (we will not sync again in this job).
          rm -rf .repo/project-objects .repo/projects .repo/repo .repo/manifests.git 2>/dev/null || true
          # Verify the previously-missing module's project actually has its Android.bp now.
          if grep -rql "kernel-config-soong-rules" kernel/configs 2>/dev/null; then
            echo "OK: kernel-config-soong-rules definition present"
          else
            echo "::warning::kernel-config-soong-rules still not found in kernel/configs"
          fi
          echo "Tree size after prune:"; du -sh . 2>/dev/null || true
          df -h /
          # The soong bootstrap parses EVERY Android.bp and fails if any references an
          # undefined module - even one irrelevant to our vendor lib. On this branch
          # hardware/interfaces/compatibility_matrices/build/Android.bp references
          # kernel-config-soong-rules, which is not present, and that one file blocks the
          # whole bootstrap. It builds VINTF compatibility matrices, which a single
          # cc_library_shared does not need, so neutralize just that file (and the kernel
          # config rules include) so the tree parses. This is surgical: we remove build
          # rules we do not use, not anything our module depends on.
          for bp in \
            hardware/interfaces/compatibility_matrices/build/Android.bp \
            hardware/interfaces/compatibility_matrices/Android.bp \
            hardware/interfaces/compatibility_matrices/Android.mk ; do
            if [ -f "$bp" ]; then
              echo "neutralizing $bp"
              printf '// emptied by ASB CI: unrelated VINTF matrix rules blocked bootstrap\n' > "$bp"
            fi
          done
          # Neutralize EVERY Android.bp that references the missing kernel-config rules,
          # tree-wide (not just hardware/interfaces) so the bootstrap parses in one pass
          # instead of failing on them one at a time. These build VINTF compatibility
          # matrices, which a single vendor cc_library does not need. Limiting to compatibility
          # matrix / vintf dirs keeps the surgery targeted.
          for d in hardware/interfaces/compatibility_matrices \
                   hardware/interfaces/vintf* system/libvintf kernel/configs; do
            [ -d "$d" ] || continue
            grep -rl "kernel-config-soong-rules\|kernel_config_data\|kernel-config-data" \
              "$d" 2>/dev/null | while read -r f; do
              case "$f" in *.bp|*.mk) echo "emptying $f"; printf '// emptied by ASB CI\n' > "$f" ;; esac
            done
          done
          # If the matrix build file itself still references it, empty it outright.
          for bp in hardware/interfaces/compatibility_matrices/build/Android.bp; do
            [ -f "$bp" ] && grep -q "kernel-config" "$bp" 2>/dev/null \
              && printf '// emptied by ASB CI\n' > "$bp" || true
          done
          # Do NOT delete subtrees here. An earlier version removed
          # packages/modules/Virtualization and external/rust, but the cuttlefish product
          # (device/google/cuttlefish/.../aosp_cf.mk) *includes* Virtualization's
          # product_packages.mk, so deleting it broke product config. The groups filter at
          # init already keeps trusty/apps/etc out at the source; nothing to prune here.
          echo "=== (no subtree deletion - groups filter handles exclusions) ==="
          # Pre-emptively neutralize EVERY module we already know blocks soong analysis, so
          # the first `m` pass gets through instead of the auto-heal loop re-bootstrapping
          # soong (~12 min each) attempt after attempt. That loop worked but was so expensive
          # that after several attempts + swap the runner was starved for CPU/memory and
          # GitHub killed it ("hosted runner lost communication") at ~2h. Emptying these up
          # front collapses the whole class into a single analysis pass.
          #  - trusty test VMs (rule_builder paths cannot be nil)
          #  - CrashRecovery APEX prebuilt (PRODUCT_APEX_SYSTEM_SERVER_JARS)
          #  - microdroid / Virtualization signed bins (avbAddHashFooter nil path)
          neutralize_bp_for() {
            # $1 = grep pattern for module names; empty each matching Android.bp (not .repo, not ours)
            grep -rlE "$1" --include='Android.bp' . 2>/dev/null | while read -r f; do
              case "$f" in ./.repo/*|*/DSP_AIDL/*|*vendor/asb/*) continue ;; esac
              echo "pre-neutralizing: $f"
              printf '// emptied by ASB CI (pre-emptive): unrelated module blocks analysis\n' > "$f"
            done
          }
          neutralize_bp_for 'trusty_test_vm_signed_bin|trusty_test_vm_os_signed_bin|trusty_test_vm'
          neutralize_bp_for 'microdroid_kernel_16k_signed|microdroid_kernel|microdroid.*_signed_bin'
          # CrashRecovery: the offending file is a prebuilt module_sdk Android.bp; empty it.
          for f in prebuilts/module_sdk/CrashRecovery/current/Android.bp \
                   prebuilts/module_sdk/CrashRecovery/*/Android.bp; do
            [ -f "$f" ] && { echo "pre-neutralizing CrashRecovery: $f"; printf '// emptied by ASB CI\n' > "$f"; }
          done
          # Whole Virtualization build dir defines many signed-bin VM modules that panic with
          # filtered deps and are irrelevant to a vendor audio lib; empty its build .bp files.
          for f in packages/modules/Virtualization/build/microdroid/Android.bp \
                   packages/modules/Virtualization/*/Android.bp; do
            [ -f "$f" ] && { echo "pre-neutralizing Virtualization: $f"; printf '// emptied by ASB CI\n' > "$f"; }
          done
          # CtsBionicRootTestCases (and siblings) hit a kati-phase error: "cannot copy target
          # from multiple modules" because both the 64- and 32-bit variants emit the same
          # meta_lic path. These CTS tests are irrelevant to a vendor audio lib but get pulled
          # into the make graph. Empty their defining Android.bp so they drop out.
          neutralize_bp_for 'CtsBionicRootTestCases|CtsBionic.*TestCases'
          # Everything below was learned from the runs that failed after the last good one.
          # This curated list is the mechanism that PRODUCED the working OP15 library - it
          # empties about fifteen files by module name. The blanket directory sweep that
          # replaced it emptied 553-858 and broke a tree that had been fine, so the lesson
          # is to extend the surgical list rather than swing wider.
          #
          # Ravenwood and Robolectric: their soong plugins dereference a missing dependency
          # without a nil check, so an absent module is a Go panic at java/ravenwood.go or
          # java/robolectric.go instead of a reportable error. Nothing can auto-heal a
          # crash - there is no error line naming a file - so they have to go before the
          # first bootstrap. Neither is an input to a vendor cc_library_shared.
          # Same trap as robolectric: "ravenwood-utils" and "ravenwood-runtime" are module
          # NAMES, and the file that declares them is frameworks/base/ravenwood/Android.bp -
          # which the directory list above already covers. Matching names here would empty
          # whatever else happens to mention them, so match the TYPE and leave the defining
          # tree to the explicit path list.
          for _rb in $(grep -rlE 'android_ravenwood_(test|libgroup)' --include=Android.bp . 2>/dev/null \
                         | grep -v '^\./\.repo/'); do
            case "$_rb" in */DSP_AIDL/*|*vendor/asb/*) continue ;; esac
            echo "pre-neutralizing ravenwood: $_rb"
            printf '// emptied by ASB CI (pre-emptive): ravenwood test blocks analysis\n' > "$_rb"
          done
          # Module TYPE only, and never robolectric's own tree.
          #
          # Matching the module NAME "Robolectric_all-target" emptied
          # external/robolectric/Android.bp - the file that DEFINES robolectric and, with
          # it, external_robolectric_license, which all ten of its subdirectories reference.
          # That is the SystemUI cascade again, from the same mistake: emptying a directory's
          # Android.bp destroys the license module its siblings depend on. What panics soong
          # is a CONSUMER declaring android_robolectric_test with its dependency missing;
          # robolectric itself is innocent.
          for _rb in $(grep -rlE 'android_robolectric_test' --include=Android.bp . 2>/dev/null \
                         | grep -v '^\./\.repo/' | grep -v '^\./external/robolectric/'); do
            case "$_rb" in */DSP_AIDL/*|*vendor/asb/*) continue ;; esac
            echo "pre-neutralizing robolectric consumer: $_rb"
            printf '// emptied by ASB CI (pre-emptive): robolectric test blocks analysis\n' > "$_rb"
          done
          # vintf_compatibility_matrix is registered by a soong plugin the filtered sync does
          # not always bring in; the files that USE it then fail with "unrecognized module
          # type". compatibility_matrices was already being healed by hand on the good run -
          # the reference-device ones simply were not present in that sync.
          neutralize_bp_for 'vintf_compatibility_matrix'
          # Confirm the release configs are present; list them so the build step (and we)
          # can see which release names actually exist on this branch.
          if [ -d build/release/aconfig ]; then
            echo "=== available release configs ==="
            ls build/release/aconfig 2>/dev/null | head -20 || true
          else
            echo "::warning::build/release/aconfig not found - lunch may fail on release config"
          fi

      - name: Stage the ASB module into the tree
        working-directory: aosp
        run: |
          mkdir -p vendor/asb/libasbdsp_aidl
          cp -a "$GITHUB_WORKSPACE"/asb-src/src/DSP_AIDL/*.cpp \
                "$GITHUB_WORKSPACE"/asb-src/src/DSP_AIDL/*.h \
                "$GITHUB_WORKSPACE"/asb-src/src/DSP_AIDL/Android.bp \
                vendor/asb/libasbdsp_aidl/
          ls -la vendor/asb/libasbdsp_aidl/

      - name: Assert the checked-out sources are current
        working-directory: aosp
        run: |
          set -e
          S=vendor/asb/libasbdsp_aidl
          fail=0
          need() { # $1=file $2=literal $3=what it provides
            if grep -q "$2" "$1" 2>/dev/null; then
              echo "  ok   $(basename "$1"): $3"
            else
              echo "::error::$(basename "$1") is an OLD revision - missing $3 (\"$2\")"
              fail=1
            fi
          }
          # These are the fixes without which the effect is known to break the device:
          # a queryEffect that can refuse zeroes the whole audio effect factory, and the
          # vendor-namespace read is the only way the effect ever sees its settings.
          need "$S/asb_effect_aidl.cpp" "answering with our descriptor anyway" "non-refusing queryEffect"
          need "$S/asb_effect_aidl.cpp" "ASB configure"                        "settings trace"
          need "$S/asb_effect_aidl.cpp" "persist.vendor.asb.dsp"               "vendor-namespace properties"
          need "$S/asb_effect_aidl.cpp" "asb_core_configure_ex"                "postgain/softclip support"
          need "$S/asb_dsp_attach.cpp"  "pushed gain_mb"                       "binder gain push"
          need "$S/asb_dsp_attach.cpp"  "SIGUSR1"                              "instant apply signal"
          if grep -q "static_cast<int16_t>" "$S/asb_effect_aidl.cpp" 2>/dev/null; then
            echo "::error::asb_effect_aidl.cpp still sign-extends the UUID fields (static_cast<int16_t>)"
            fail=1
          fi
          [ "$fail" = "0" ] || { echo "::error::the repository holds an older DSP source - push the current one before building"; exit 1; }
          echo "sources are current"

      - name: Add swap (cover ninja-generation peak)
        run: |
          # The soong "generating ninja" phase was SIGTERM-killed (exit 143) on the 32 GB
          # runner: soong_build finished (130/131) then the analyze phase peaked and the
          # process was killed. 32 GB is right at the edge for this phase, and a trimmed 4-8 GB
          # swap did not cover the spike (a prior run passed only by luck). The larger runner
          # has a 300 GB SSD, so a big swapfile is free insurance against the peak. Keep
          # swappiness modest so it only spills at the peak instead of thrashing throughout.
          sudo swapoff -a || true
          AVAIL_GB=$(df --output=avail -BG / 2>/dev/null | tail -1 | tr -dc '0-9')
          [ -z "$AVAIL_GB" ] && AVAIL_GB=0
          # Aim for 32 GB swap (so RAM+swap ~= 64 GB, comfortably above the peak), but never
          # take more than half the free disk so out/ still has room.
          SWAP_GB=32
          HALF=$(( AVAIL_GB / 2 ))
          [ "$SWAP_GB" -gt "$HALF" ] && SWAP_GB="$HALF"
          [ "$SWAP_GB" -lt 8 ] && SWAP_GB=8
          echo "avail=${AVAIL_GB}G -> swap=${SWAP_GB}G"
          sudo fallocate -l "${SWAP_GB}G" /mnt/swapfile \
            || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=$(( SWAP_GB * 1024 ))
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Modest swappiness: use swap for the peak, not for everything (keeps it fast).
          sudo sysctl vm.swappiness=30 || true
          echo "=== memory + swap ==="; free -h

      # Which AIDL interface version did THIS tree freeze? Read it from the interface's
      # own api dumps rather than inferring it from the branch name - the highest frozen
      # directory is the version a device built from this tree declares in VINTF.
      #
      # This exists because two runs of this workflow used to produce byte-different
      # libraries under identical names, so the only way to tell an Android 15 build from
      # an Android 16 one was to remember which you ran. A OnePlus 13 declaring effect
      # v2 could not load a v3-built library, and nothing in the artifact said which it
      # was.
      - name: Detect AIDL effect interface version
        # Paths below are relative to the AOSP tree. Without this the step ran in the repo
        # root, found no aidl_api directory and reported "could not read a frozen version" -
        # which is what it would have done in its old position after the build too.
        working-directory: aosp
        run: |
          set -eu
          API_DIR="hardware/interfaces/audio/aidl/aidl_api/android.hardware.audio.effect"
          V=""
          if [ -d "$API_DIR" ]; then
            V="$(ls "$API_DIR" 2>/dev/null | grep -E '^[0-9]+$' | sort -n | tail -1)"
          fi
          if [ -z "$V" ]; then
            echo "::warning::could not read a frozen version from $API_DIR - naming the output 'vX'"
            V="X"
          fi
          # Every FROZEN version lives in this one tree - stable AIDL keeps them all, and
          # soong exposes each as android.hardware.audio.effect-V<N>-ndk. So a build for an
          # older vendor interface does not need an older AOSP branch at all: the OP13 runs
          # Android 16 but its vendor partition is frozen at the Android 15 HAL set, which
          # is a Treble/GRF property of the DEVICE, not of the system image. Print what is
          # actually available here, and what the defaults pin to, so the second variant can
          # be wired up from evidence instead of from assumption.
          echo "--- frozen versions available in this tree ---"
          ls "$API_DIR" 2>/dev/null | sort -V | tr '\n' ' '; echo
          echo "--- aidlaudioeffectservice_defaults ---"
          _dbp="hardware/interfaces/audio/aidl/default/Android.bp"
          if [ -f "$_dbp" ]; then
            awk '/cc_defaults[[:space:]]*\{/,/^\}/' "$_dbp" \
              | grep -A25 'aidlaudioeffectservice_defaults' | head -30
          else
            echo "(not synced: $_dbp)"
          fi
          echo "--- ndk targets matching the effect interface ---"
          grep -rhoE 'android\.hardware\.audio\.effect-V[0-9]+-ndk' \
            hardware/interfaces/audio/aidl 2>/dev/null | sort -u | tr '\n' ' '; echo
          echo "ASB_EFFECT_V=$V" >> "$GITHUB_ENV"
          echo "android.hardware.audio.effect frozen version on this tree: $V"

      - name: Build libasbdsp_aidl (arm64 + arm)
        working-directory: aosp
        run: |
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true
          # Soong reads its own variable, and it was never set: the make-level flag alone
          # leaves blueprint erroring out at analysis time on every dangling reference a
          # filtered sync leaves behind. With this, missing modules become a problem only
          # if something we actually build needs them.
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_DISABLE_BAZEL=true
          # Use all cores: the 32 GB larger runner has the memory headroom that the old 16 GB
          # runner lacked, so the -j2 cap (a memory workaround) is no longer needed and just
          # wasted 6 idle cores. Full parallelism makes soong analysis + our build much faster.
          MJOBS="$(nproc)"
          # envsetup.sh physically lives in build/make/; AOSP's default.xml normally creates
          # a build/envsetup.sh linkfile to it. Source whichever path exists so a missing
          # linkfile does not break the build.
          if [ -f build/envsetup.sh ]; then
            source build/envsetup.sh
          elif [ -f build/make/envsetup.sh ]; then
            source build/make/envsetup.sh
          else
            echo "::error::envsetup.sh not found - build/make did not sync"; exit 1
          fi
          # Pick a release config that actually exists on this branch instead of guessing.
          # build/release/aconfig/<name>/ dirs ARE the valid release names (trunk_staging,
          # trunk_stable, ap*, etc). Prefer trunk_staging (most permissive for a from-source
          # build), then trunk_stable, then whatever is first.
          RELEASES="$(ls build/release/aconfig 2>/dev/null || true)"
          if [ -z "$RELEASES" ]; then
            # The blob:limit partial-clone filter can leave build/release without its
            # aconfig files. Force a full fetch of just that project, then re-list.
            echo "release configs empty - refetching build/release in full"
            ( cd build/release && git fetch --refetch --filter=blob:none origin 2>/dev/null \
                && git checkout -f HEAD 2>/dev/null ) || true
            RELEASES="$(ls build/release/aconfig 2>/dev/null || true)"
          fi
          echo "release configs found: ${RELEASES:-<none>}"
          REL=""
          for cand in trunk_staging trunk_stable next; do
            echo "$RELEASES" | grep -qx "$cand" && { REL="$cand"; break; }
          done
          [ -n "$REL" ] || REL="$(echo "$RELEASES" | grep -E '^(trunk|ap|next)' | head -1)"
          [ -n "$REL" ] || REL="$(echo "$RELEASES" | head -1)"
          echo "using release: ${REL:-<unknown>}"
          _lunched=0
          # Prefer the BARE aosp_arm64 product first. It is defined in
          # build/make/target/product and pulls far fewer deps than the cuttlefish (aosp_cf_*)
          # products, which reference device/google/cuttlefish + packages/modules/Virtualization
          # and a long device dependency chain. For building one vendor cc_library we do not
          # need a full device product, so the leaner product is both faster and less likely
          # to trip over an unmet product-config include.
          for prod in aosp_arm64 aosp_cf_arm64_only_phone aosp_cf_arm64_phone; do
            combo="${prod}-${REL}-userdebug"
            echo "--- trying lunch $combo ---"
            if lunch "$combo"; then _lunched=1; echo "lunch OK: $combo"; break; fi
          done
          [ "$_lunched" = "1" ] || { echo "::error::no lunch combo worked (release=$REL)"; exit 1; }
          # OFF BY DEFAULT, and that is deliberate.
          #
          # This workflow built the shipped OP15 library on this same branch before any of
          # this existed. Emptying 550-850 Android.bp files is by far the largest change
          # since, and it is demonstrably capable of breaking a tree that was fine: the
          # ravenwood prune took out the file defining frameworks_base_packages_SystemUI_license
          # and cost 19 sibling directories, which then had to be "healed" in turn. Fixing
          # the cascade was treating a symptom of this step existing at all.
          #
          # So the default path is now the one that is known to have worked, and the prune
          # is something to switch on deliberately if a build genuinely needs it. Removing
          # code is not a safe default when the thing being removed is someone else's build
          # graph.
          if [ "${{ github.event.inputs.pre_prune }}" != "true" ]; then
            echo "pre-prune: disabled - the curated neutralize_bp_for list above is the"
            echo "            mechanism that built the shipped library; this blanket sweep"
            echo "            is a last resort, not a default"
          else
          # Pre-emptively empty the Android.bp files of trees that cannot possibly matter
          # for one vendor shared library. Neutralizing these after a failed bootstrap
          # costs a full minute of soong analysis per pass, and the android15-release sync
          # leaves eleven of them - four wasted rebuild cycles to discover what we already
          # know: reference device configs, host-test prebuilts and framework test suites
          # are not inputs to libasbdsp_aidl. Doing it up front turns a whack-a-mole loop
          # into a single pass.
          _pruned=0
          for _pd in device/google prebuilts/misc frameworks/base/ravenwood \
                     frameworks/base/services/tests frameworks/base/tests \
                     platform_testing cts; do
            [ -d "$_pd" ] || continue
            for _pb in $(find "$_pd" -name Android.bp -type f 2>/dev/null); do
              printf '// emptied by ASB CI pre-prune\n' > "$_pb"
              _pruned=$((_pruned + 1))
            done
          done
          # Ravenwood test modules crash soong outright in a filtered tree, wherever they
          # live. SOONG_ALLOW_MISSING_DEPENDENCIES does not save us: the ravenwood plugin
          # dereferences its runtime dependency without a nil check, so a missing
          # ravenwood-utils is a Go panic at java/ravenwood.go:190 rather than a reported
          # error. That is unrecoverable by definition - there is no error line naming a
          # file to neutralize, which is exactly why the previous run ended in a stack
          # trace. Prune them by MODULE TYPE rather than by directory, since they are
          # scattered well outside the test trees above, and none of them can matter for
          # building one vendor shared library.
          # Match the module type anywhere on the line, not just at its start: the previous
          # anchored pattern emptied 7 files and still left the one declaring ravenwood-utils,
          # which panicked soong on the very next pass. Also catch the name directly, since a
          # surviving libgroup is not something the build can report as an ordinary error.
          echo "pre-prune: emptied $_pruned Android.bp file(s) in trees irrelevant to this build"
          fi

          # Build with an auto-heal loop. soong analyzes the WHOLE tree before building our
          # module, and unrelated modules (trusty test VMs, CrashRecovery APEX prebuilts,
          # etc.) can fail analysis with product-config errors that have nothing to do with a
          # vendor audio lib. Rather than fix them one-per-CI-run, parse the failing
          # Android.bp path out of soong's error and neutralize it, then retry - all within
          # this single run. Capped so a genuine error in OUR module still fails fast.
          build_ok=0
          # We build via soong's ninja graph directly, NOT `m`. `m libasbdsp_aidl` runs the
          # full kati/make product graph, which pulls in hundreds of unrelated modules (NFC,
          # CTS, priv-app...) whose make-phase conflicts ("overriding commands", "cannot copy
          # target") are endless and not tied to a single Android.bp we can neutralize. Soong
          # emits out/soong/build.<product>.ninja describing our lib + its REAL deps; building
          # that target with ninja skips the make graph entirely. We still keep an auto-heal
          # loop for the soong-analysis phase (Android.bp panics), which runs before ninja.
          for attempt in $(seq 1 10); do
            echo "=== build attempt $attempt ==="
            set +e
            # ONE soong-only invocation does analysis AND builds our module. Do NOT run a
            # separate `m nothing` first: that ran the memory-heavy ninja-generation phase a
            # SECOND time, and on a 16GB runner the duplicate analysis hung ~30 min and got
            # the runner killed (exit 143). SOONG_ONLY=true keeps the kati product graph
            # (NFC/CTS/priv-app) out, so only our lib + real deps are evaluated.
            # V3 and the daemon FIRST, on their own. Building both variants in one
            # invocation means a V2 analysis error takes the whole ninja graph down with it
            # and the run ends with nothing - which is what happened on the last three
            # attempts, each costing half an hour to produce zero artifacts. V3 is the
            # variant most devices need; it should never be hostage to the experimental one.
            SOONG_ONLY=true m -j"$MJOBS" libasbdsp_aidl asb_dsp_attach 2>&1 | tee /tmp/asb_build.log
            rc=${PIPESTATUS[0]}
            set -e
            # V3 is the gate. If only the V2 target failed we still want the run's output;
            # the collect step warns and the installer falls back with an explicit message.
            if [ "$rc" = "0" ] && find out -name 'libasbdsp_aidl.so' | grep -q .; then
              build_ok=1; break
            fi
            # Recover an already-compiled unstripped .so if only a late action (strip) failed.
            # Guard: never take this path when the compile itself reported an error in OUR
            # module. Without the guard a real compile failure still counted as success as
            # long as some libasbdsp_aidl.so existed, and the job happily uploaded a binary
            # that did not contain the sources it was supposed to be built from.
            UNSTRIPPED=""
            # A V2-only failure is not a reason to abandon the run: V3 is what most devices
            # need and the installer falls back with an explicit message on the rest. Say
            # which variant broke, so the log answers that without re-reading the trace.
            if grep -qE 'module "libasbdsp_aidl_v2"' /tmp/asb_build.log 2>/dev/null \
               && ! grep -qE 'module "libasbdsp_aidl"' /tmp/asb_build.log 2>/dev/null; then
              echo "::warning::only the V2 variant failed - V3 is unaffected"
              grep -E 'libasbdsp_aidl_v2.*(error|depends on)' /tmp/asb_build.log | head -5
            fi
            if ! grep -qE "vendor/asb/libasbdsp_aidl.*error:|asb_effect_aidl\.cpp.*error:|asb_dsp_attach\.cpp.*error:|asb_dsp_core\.h.*error:" /tmp/asb_build.log; then
              UNSTRIPPED="$(find out/soong/.intermediates -path '*libasbdsp_aidl*/unstripped/libasbdsp_aidl.so' 2>/dev/null | head -5)"
            else
              echo "::error::our own sources failed to compile - not recovering any earlier .so"
            fi
            if [ -n "$UNSTRIPPED" ]; then
              echo "late action failed but the compiled .so exists; recovering unstripped copies"
              echo "$UNSTRIPPED" | while read -r u; do
                cp -f "$u" "${u%/unstripped/libasbdsp_aidl.so}/libasbdsp_aidl.so" 2>/dev/null || true
              done
              find out -name 'libasbdsp_aidl.so' | grep -q . && { build_ok=1; break; }
            fi
            # If our own module has a real error, surface it and stop (do not auto-heal ours).
            if grep -qE "vendor/asb/libasbdsp_aidl.*missing dependencies|DSP_AIDL.*error:|libasbdsp_aidl.*undefined reference" /tmp/asb_build.log; then
              echo "::error::libasbdsp_aidl real code/deps error:"
              grep -E "missing dependencies|error:|undefined reference|fatal error" /tmp/asb_build.log | head -20
              break
            fi
            # A blueprint panic is not an ordinary analysis error and must not be guessed
            # at. Last run, the module-name fallback below reacted to one by emptying
            # frameworks/base/services/tests/.../Android.bp - a file that merely REFERENCES
            # the missing module rather than defining it - and the next pass came back with
            # a Go stack trace instead of an error list. Stop and report.
            if grep -qE '^panic:|^goroutine [0-9]+ \[' /tmp/asb_build.log 2>/dev/null; then
              echo "::error::soong/blueprint crashed - not auto-healing a crash"
              grep -E '^panic:|unrecognized module type|undefined module' /tmp/asb_build.log | head -10
              break
            fi

            # Missing license modules are SYNTHESIZED, not healed by deletion.
            #
            # A directory's Android.bp usually carries the license{} module that every
            # subdirectory references through default_applicable_licenses. Emptying such a
            # file to silence one error takes that license module with it and leaves every
            # sibling dangling - one prune of 7 ravenwood files cost 19 SystemUI directories
            # on the last run, and healing those produced more dangling references in turn.
            # That is not convergence, it is a chain reaction started by our own fix.
            #
            # Adding a permissive stub instead only ever ADDS modules. Nothing that works
            # is removed, and the cascade cannot start.
            _lic="$(grep -oE 'undefined module "[A-Za-z0-9_.-]+_license"' /tmp/asb_build.log \
                      | sed 's/.*"\(.*\)"/\1/' | sort -u)"
            if [ -n "$_lic" ]; then
              # ACCUMULATE. Truncating this file each pass meant every round of healing
              # erased the stubs the previous round had added, so the build oscillated:
              # synthesize the SystemUI license, lose the robolectric one, synthesize that,
              # lose SystemUI again. The log shows "synthesized 1 missing license module(s)"
              # twice in a row for that reason, each time undoing the last.
              mkdir -p asb_license_stubs
              [ -f asb_license_stubs/Android.bp ] || : > asb_license_stubs/Android.bp
              for _ln in $_lic; do
                grep -q "\"$_ln\"" asb_license_stubs/Android.bp 2>/dev/null && continue
                printf 'license {\n    name: "%s",\n' "$_ln" >> asb_license_stubs/Android.bp
                printf '    visibility: ["//visibility:public"],\n' >> asb_license_stubs/Android.bp
                printf '    license_kinds: ["SPDX-license-identifier-Apache-2.0"],\n}\n' >> asb_license_stubs/Android.bp
              done
              echo "auto-heal: synthesized $(echo "$_lic" | wc -l) missing license module(s)"
              continue
            fi

            # Otherwise auto-heal the unrelated Android.bp files that blocked soong analysis.
            #
            # ALL of them, in one pass. This used to take the first path in the error output
            # and neutralize exactly that, then re-bootstrap: one file per attempt, against a
            # six-attempt budget. On a branch whose filtered sync leaves a dozen dangling
            # license modules and an unknown vintf_compatibility_matrix type, that is not a
            # loop that converges - the android15-release run burned all six attempts on
            # redbull, redfin, redfin/vf, gpt-utils and two prebuilts/misc files while five
            # more were still listed in the same error block. Soong reports every offending
            # file it found; there is no reason to fix them one bootstrap at a time.
            _healed=0
            for _bp in $(grep -oE '[A-Za-z0-9_./-]+/Android\.bp:[0-9]+' /tmp/asb_build.log \
                           | sed 's/:.*//' | sort -u); do
              [ -f "$_bp" ] || continue
              case "$_bp" in
                */DSP_AIDL/*|*vendor/asb/*)
                  echo "::error::failing Android.bp is OUR module ($_bp) - real error"
                  _healed=-1; break ;;
              esac
              echo "auto-heal: neutralizing unrelated $_bp"
              printf '// emptied by ASB CI auto-heal\n' > "$_bp"
              _healed=$((_healed + 1))
            done
            if [ "$_healed" -lt 0 ]; then break; fi
            if [ "$_healed" -gt 0 ]; then
              echo "auto-heal: neutralized $_healed file(s) this pass"
              continue
            fi
            # No file named by soong means nothing safe is left to do. The old fallback
            # here grepped the whole tree for a module NAME and emptied the first file that
            # mentioned it - a consumer far more often than a definer, so it removed working
            # code, left the dangling reference in place and took soong down with it on the
            # next pass. If soong did not name a file, we do not guess.
            echo "::error::build failed and no Android.bp was named - not guessing"
            tail -40 /tmp/asb_build.log || true
            break
          done
          [ "$build_ok" = "1" ] || { echo "::error::build did not succeed"; exit 1; }

          # V2, separately and best-effort. The tree is already analyzed and V3's objects
          # are on disk, so this is a short incremental pass rather than another half hour.
          # Its failure is reported in full and does NOT fail the run: devices whose vendor
          # partition is frozen at effect v2 (a OnePlus 13 on Android 16, for instance) need
          # this library, but the ones on v3 should not lose their build while we get there.
          # Local copy of the effect-impl sources for the V2 build, with the one V3-only
          # state removed.
          #
          # EffectImpl.cpp on an Android 16 tree uses State::DRAINING, which V3 added and
          # V2 does not have - the drain-on-stop path. On V2 a stop goes straight to IDLE,
          # so substituting IDLE is not a workaround, it is what the state machine did
          # before DRAINING existed: "RETURN_OK_IF(mState == IDLE || mState == IDLE)" is a
          # harmless duplicate, and "mState = IDLE" is the V2 behaviour.
          #
          # The V3 target keeps using the tree's own filegroup untouched; only this copy is
          # rewritten, so nothing about the V3 build changes.
          # Patch the effect-impl sources IN PLACE rather than copying them.
          #
          # The copy approach worked for the substitution and broke on include paths: these
          # files include their own headers as "include/effect-impl/EffectTypes.h", relative
          # to the directory they normally live in, so a copy under a different directory
          # cannot resolve them without extra search roots. Editing them where they are
          # keeps every path exactly as AOSP wrote it - there is nothing left to get wrong.
          #
          # V3 has already been built and its objects are on disk by this point, so it is
          # unaffected by an edit made now. The tree is a throwaway CI checkout; nothing
          # here is committed anywhere.
          _EI="hardware/interfaces/audio/aidl/default"
          _patched=0
          for _f in EffectImpl.cpp EffectThread.cpp EffectContext.cpp; do
            [ -f "$_EI/$_f" ] || continue
            if grep -q 'State::DRAINING' "$_EI/$_f" 2>/dev/null; then
              sed -i 's/State::DRAINING/State::IDLE/g' "$_EI/$_f"
              _patched=$((_patched + 1))
            fi
          done
          echo "V2 effect-impl: patched $_patched file(s) in place, DRAINING -> IDLE"
          grep -rc 'State::DRAINING' "$_EI"/EffectImpl.cpp 2>/dev/null || true

          echo "=== building the V2 variant (best effort) ==="
          set +e
          SOONG_ONLY=true m -j"$MJOBS" libasbdsp_aidl_v2 2>&1 | tee /tmp/asb_build_v2.log
          v2rc=${PIPESTATUS[0]}
          set -e
          if [ "$v2rc" = "0" ] && find out -name 'libasbdsp_aidl_v2.so' | grep -q .; then
            echo "V2 variant built"
          else
            echo "::warning::the V2 variant did not build - v3 devices are unaffected"
            # The "|| echo (none)" idiom does not work through a pipe - the || binds to
            # head, which succeeds on empty input - so every category printed as blank and
            # an empty section was indistinguishable from a missing one. Report the real
            # blocker instead: the FIRST fatal error, whatever it is.
            echo "--- first fatal error ---"
            grep -m1 -B2 'fatal error:' /tmp/asb_build_v2.log || echo "  (none)"
            # Print the SOURCE around each error. A message names a symbol; the lines
            # around it say what the code was doing with it, which is what decides whether
            # a substitution is safe. Not having this cost a round trip on DRAINING.
            echo "--- source context for each error ---"
            grep -oE '[A-Za-z0-9_./-]+\.(cpp|h):[0-9]+:[0-9]+: error' /tmp/asb_build_v2.log \
              | sed 's/:[0-9]*: error//' | sort -u | head -5 | while IFS=: read -r _sf _sl; do
              [ -f "$_sf" ] || continue
              echo "  --- $_sf:$_sl"
              sed -n "$((_sl>4?_sl-4:1)),$((_sl+4))p" "$_sf" | sed 's/^/      /'
            done
            echo "--- version conflicts (a dependency pinned to the wrong interface) ---"
            grep -E 'depends on multiple versions|aidl_interface' /tmp/asb_build_v2.log \
              | head -5 || echo "  (none)"
            echo "--- compile errors in OUR source ---"
            grep -E 'asb_effect_aidl\.cpp.*error:' /tmp/asb_build_v2.log | head -10 || echo "  (none)"
            echo "--- compile errors in the AOSP effect-impl sources (V3-only APIs?) ---"
            grep -E '(EffectImpl|EffectThread|EffectContext)\.cpp.*error:' /tmp/asb_build_v2.log \
              | head -10 || echo "  (none)"
            echo "--- undefined symbols (something we dropped WAS needed) ---"
            grep -E 'undefined (symbol|reference)' /tmp/asb_build_v2.log | head -10 || echo "  (none)"
            # Catch-all. The categories above are guesses at what MIGHT go wrong; this is
            # simply the first error, whatever it is. Two rounds were spent on errors that
            # matched no category and therefore printed nothing at all - a V3-only member
            # in a header we did not even use, and before that a missing include path.
            echo "--- every compile error, uncategorised ---"
            grep -E '\.(cpp|h):[0-9]+:[0-9]+: (error|fatal error):' /tmp/asb_build_v2.log \
              | sort -u | head -10 || echo "  (none)"
          fi
          echo "=== produced .so files ==="
          find out -name 'libasbdsp_aidl.so' -exec ls -la {} \;

      - name: Collect artifacts into prebuilt layout
        working-directory: aosp
        run: |
          # soong writes variant dirs like android_vendor_arm64_armv8-a_shared and
          # android_vendor_arm_armv8-a_shared. The old 32-bit pattern '*/arm/*' required a
          # path component exactly "arm" and therefore never matched, so the arm .so was
          # built but silently not collected. Match the variant dir names instead.
          # The attacher daemon: a system (non-vendor) binary, so its variant dir has no
          # "vendor" in the path. It is what actually creates the effect on session 0 -
          # OxygenOS never applies the config's <postprocess>, so without this nothing asks
          # the framework to instantiate our effect.
          ATT64="$(find out -path '*asb_dsp_attach*' -name asb_dsp_attach -type f \
                     ! -path '*/unstripped/*' | head -1)"
          echo "attach: ${ATT64:-<none>}"
          if [ -n "$ATT64" ]; then
            mkdir -p "$GITHUB_WORKSPACE/prebuilt/arm64-v8a"
            cp -f "$ATT64" "$GITHUB_WORKSPACE/prebuilt/arm64-v8a/asb_dsp_attach"
            chmod 0755 "$GITHUB_WORKSPACE/prebuilt/arm64-v8a/asb_dsp_attach"
          else
            echo "::warning::asb_dsp_attach not found - the effect will register but never attach"
          fi
          OUT64="$(find out -path '*android_vendor_arm64_*' -name libasbdsp_aidl.so \
                     ! -path '*/unstripped/*' | head -1)"
          [ -n "$OUT64" ] || OUT64="$(find out -path '*arm64*' -name libasbdsp_aidl.so | head -1)"
          OUT32="$(find out -path '*android_vendor_arm_*' -name libasbdsp_aidl.so \
                     ! -path '*/unstripped/*' | head -1)"
          [ -n "$OUT32" ] || OUT32="$(find out -name libasbdsp_aidl.so | grep -E '_arm_' | head -1)"
          echo "arm64: ${OUT64:-<none>}"; echo "arm:   ${OUT32:-<none>}"
          DEST="$GITHUB_WORKSPACE/prebuilt"
          mkdir -p "$DEST/arm64-v8a" "$DEST/armeabi-v7a"
          if [ -n "$OUT64" ]; then
            cp -f "$OUT64" "$DEST/arm64-v8a/libasbdsp_aidl.so"
            cp -f "$OUT64" "$DEST/arm64-v8a/libasbdsp_v${ASB_EFFECT_V}.so"
          fi
          if [ -n "$OUT32" ]; then
            cp -f "$OUT32" "$DEST/armeabi-v7a/libasbdsp_aidl.so"
            cp -f "$OUT32" "$DEST/armeabi-v7a/libasbdsp_v${ASB_EFFECT_V}.so"
          fi

          # The V2 variant carries its version in the module name, so it is named from that
          # and not from whatever this tree happens to freeze last.
          # Exclude unstripped/, exactly as the V3 search above does. Soong writes both a
          # stripped .so and a debug copy under unstripped/, and find returns whichever it
          # reaches first - the V2 block was copied from the V3 one without this filter, so
          # the first artifact carried full debug info: 1.98 MB against V3's 378 KB. Same
          # code, five times the size, and it would have shipped that way.
          V2OUT64="$(find out -path '*android_vendor_arm64_*' -name libasbdsp_aidl_v2.so \
                       ! -path '*/unstripped/*' 2>/dev/null | head -1)"
          [ -n "$V2OUT64" ] || V2OUT64="$(find out -path '*arm64*' -name libasbdsp_aidl_v2.so \
                       ! -path '*/unstripped/*' 2>/dev/null | head -1)"
          V2OUT32="$(find out -path '*android_vendor_arm_*' -name libasbdsp_aidl_v2.so \
                       ! -path '*/unstripped/*' 2>/dev/null | head -1)"
          [ -n "$V2OUT32" ] || V2OUT32="$(find out -name libasbdsp_aidl_v2.so \
                       ! -path '*/unstripped/*' 2>/dev/null | grep -E '_arm_' | head -1)"
          if [ -n "$V2OUT64" ]; then
            cp -f "$V2OUT64" "$DEST/arm64-v8a/libasbdsp_v2.so"
            echo "collected V2 arm64: $V2OUT64"
            # The two builds share every source, so their sizes should be close. A large
            # gap means a debug copy slipped through rather than a real difference.
            _v2sz=$(wc -c < "$DEST/arm64-v8a/libasbdsp_v2.so")
            _v3sz=$(wc -c < "$DEST/arm64-v8a/libasbdsp_v3.so" 2>/dev/null || echo 0)
            if [ "$_v3sz" -gt 0 ] && [ "$_v2sz" -gt $((_v3sz * 2)) ]; then
              echo "::warning::libasbdsp_v2.so is $_v2sz bytes vs v3 $_v3sz - looks unstripped"
            fi
          else
            echo "::warning::libasbdsp_aidl_v2 (arm64) not produced - devices on effect v2 will fall back"
          fi
          if [ -n "$V2OUT32" ]; then
            cp -f "$V2OUT32" "$DEST/armeabi-v7a/libasbdsp_v2.so"
            echo "collected V2 arm: $V2OUT32"
          fi
          echo "=== staged ==="; find "$DEST" -name '*.so' -exec ls -la {} \;
          # Verify the AIDL factory symbol is exported (the whole reason this port exists).
          for so in "$DEST"/*/libasbdsp_aidl.so; do
            [ -f "$so" ] || continue
            echo "--- $so ---"
            if command -v llvm-nm >/dev/null 2>&1; then NM=llvm-nm; else NM=nm; fi
            "$NM" -D "$so" 2>/dev/null | grep -E ' createEffect| queryEffect| destroyEffect' \
              && echo "  AIDL factory symbols present" \
              || echo "  WARNING: factory symbols not found (check build)"
          done

      - name: Verify the artifacts were built from THESE sources
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/asb-src/src/DSP_AIDL"
          DEST="$GITHUB_WORKSPACE/prebuilt"
          fail=0
          # Each distinctive log literal that exists in a source file must also exist in the
          # binary produced from it. If one is missing, the artifact came from older code -
          # which is exactly how a build that "succeeded" kept shipping a library whose
          # queryEffect answered with an error and left the device with zero audio effects.
          check() { # $1=binary $2=source $3..=literals
            bin="$1"; src="$2"; shift 2
            [ -f "$bin" ] || { echo "::error::missing artifact $bin"; fail=1; return; }
            for lit in "$@"; do
              grep -q "$lit" "$src" 2>/dev/null || continue
              if grep -aq "$lit" "$bin" 2>/dev/null; then
                echo "  ok   $(basename "$bin"): $lit"
              else
                echo "::error::$(basename "$bin") is STALE - source has \"$lit\", binary does not"
                fail=1
              fi
            done
          }
          for abi in arm64-v8a armeabi-v7a; do
            [ -f "$DEST/$abi/libasbdsp_aidl.so" ] || continue
            check "$DEST/$abi/libasbdsp_aidl.so" "$SRC/asb_effect_aidl.cpp" \
                  "ASB queryEffect" "ASB configure" "ASB process"
          done
          check "$DEST/arm64-v8a/asb_dsp_attach" "$SRC/asb_dsp_attach.cpp" \
                "pushed gain_mb" "gain change"
          [ "$fail" = "0" ] || { echo "::error::artifacts do not match the sources - refusing to upload"; exit 1; }
          echo "artifacts match the sources"

      - name: Upload .so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libasbdsp-aidl-v${{ env.ASB_EFFECT_V }}-prebuilt
          path: |
            prebuilt/**/libasbdsp_aidl.so
            prebuilt/**/libasbdsp_v*.so
            prebuilt/**/asb_dsp_attach
          if-no-files-found: error
          retention-days: 30
