name: Feature request
description: Suggest a setting, card or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should ASB do
      description: Describe the behaviour you want and the situation where you need it.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and firmware
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Measurements, logs or documentation that show the change helps. Link sources rather than pasting long text.
