hard_clamp_headroom_pct=48
# Performance thermal band.
#
# The exit was 45 against an enter of 48 - a 3 degree window, which is narrower than the
# swing a single frequency ramp produces. The result is oscillation: lean in at 48, cool
# to 45, release, heat straight back to 48. Measured on a real device the big-core ceiling
# moved between 53% of adjacent samples, 33 of those by 400 MHz or more, and every ramp
# back up spends energy to arrive at the same clamp again.
#
# Widening the exit to 42 costs nothing in sustained throughput - the lean level is
# unchanged, it simply stops being released prematurely - and each avoided ramp is heat
# not generated. This is the one thermal lever here that does not trade away performance.
perf_sustained_temp_enter=48
perf_sustained_temp_exit=42
perf_sustained_level=0.62
perf_hot_guard_temp=58
perf_hot_guard_ticks=2
perf_skin_hot_thresh=80
balanced_sustained_temp_enter=54
balanced_sustained_temp_exit=48
auto_battery_enable=1
# Auto Battery profile thresholds.
#   low  = switch INTO Battery at this level or below (the test is <=, so 20 means "at 20%")
#   high = return to the previous profile at this level or above
# The gap is deliberately one percent: switch at 20, come back at 21, symmetric around the
# setting. Repeated switching near the boundary is bounded by auto_battery_min_gap_s below,
# not by the size of this gap.
auto_battery_low_pct=20
auto_battery_high_pct=21
auto_battery_min_gap_s=300
night_quiet_enable=1
night_quiet_hour_start=23
night_quiet_hour_end=6
BG_TRIM_LEVEL=safe
UX_ANIM_FORCE_RESTART=0
UX_MANAGE_TIMEOUTS=0
UX_MANAGE_OEM_TOGGLES=0

# Disable blur: 0 | 1
#   Turns window blur off everywhere. There is no middle setting, and it is worth
#   recording why: exactly two controls on this platform do anything - the WindowManager
#   global (live) and persist.sys.sf.disable_blurs (read at service start) - and both are
#   global. The ro.oplus.* and ro.launcher.* keys look per-surface but are read-only
#   properties consumed before the module mounts, so a module-supplied value is too late.
#   A "light" mode built from those alone tested identical to stock; one that also set
#   the globals tested identical to off. There is nothing in between to expose.
#   Applies to the window layer at once, the compositor layer after a reboot.
disable_blur=0

# OxygenOS visual-effects level: stock | flat
#   stock leaves it alone. flat sets persist.sys.oplus.anim_level=0, which is NOT a blur
#   property - it is the OEM's overall effects level, and dropping it turns Recents from
#   card previews into a plain list, among other things.
#   It used to be bundled into disable_blur, so someone who wanted a sharp notification
#   shade lost their Recents cards with no way back short of re-enabling blur. Blur off
#   with effects untouched is a reasonable thing to want, and now it is expressible.
#   Costs a little GPU work at the flat setting. Applies after a reboot.
#   Leave it EMPTY (the shipped default) and it follows disable_blur - which is what
#   this used to do when the two were one setting, so an existing install behaves
#   exactly as before. Set it explicitly to keep blur off while leaving Recents alone,
#   or to flatten effects without touching blur.
ui_effects_level=auto

# Vibration strength: 0-10, or "stock"
#   OnePlus keeps the real control on its own scale. The standard Android keys
#   (*_vibration_intensity, 0-3) were already at 3 on this device, so raising them did
#   nothing - watching what the OEM's own slider writes shows it rewrites
#   *_stepless_vibration_intensity instead, on a much finer range. This sets both: the
#   coarse keys open the gate, the stepless value is the amplitude actually felt.
#   10 maps to 2400, the highest value the OEM slider was observed to produce. Going
#   above a tested value on a linear actuator is wear for no promise, so that is the top.
#   "stock" restores whatever the device had, which is not the same as any number.
#   Duration is not adjustable - it comes from each effect's own waveform.
# --- Network -------------------------------------------------------------------------
# These sit ON TOP of the per-profile network tuning: auto = leave the profile's choice
# alone, anything else pins a value the profile will not override. All applied live.
#
# TCP congestion control: auto|bbr|cubic
#   BBR paces to measured bandwidth; on mobile links that beats Cubic, which treats radio
#   interference as congestion and backs off for no reason. Unavailable algorithms are
#   reported rather than silently ignored.
net_congestion=auto

# Queue discipline: auto|fq|fq_codel|cake
#   fq_codel keeps latency low under load, fq pairs with BBR, cake is thorough but heavy.
#   Also pushed onto live interfaces with tc, since default_qdisc alone only affects
#   interfaces brought up afterwards.
net_qdisc=auto

# WiFi regulatory domain: auto|CR|US|DE|JP|...
#   Decides which channels and channel widths are legal, and therefore what aggregation
#   the radio may use. CR allows the widest set. auto releases any forced domain.
#   Setting a domain that does not match your location is the user's responsibility.
wifi_country=auto

# Initial TCP windows per route: auto|off|conservative|aggressive
#   How many segments may go out, and be advertised, before the first ACK. Chosen from the
#   link actually present - negotiated rate, MTU, radio technology - rather than one fixed
#   number for every connection:
#     weak    cwnd 10 (the RFC value, deliberately NOT raised - a bigger first burst on a
#             lossy link is how you cause the loss)
#     normal  cwnd 16
#     fast    cwnd 24
#   The advertised window is sized from the bandwidth-delay product and bounded by what the
#   receive buffer can actually hold, so it does not promise more than the kernel can store.
#   conservative pins the RFC value everywhere; aggressive shifts one class up; off restores
#   the routes as they were. Re-applied on link change through `ip monitor`, with no polling.
net_route_tune=auto

# WiFi scan throttle: auto|0|1
#   0 scans more often (roams sooner, costs battery), 1 is stock, auto leaves it alone.
wifi_scan_throttle=auto

haptic_strength=-1

# Touch-feedback strength: 0-10, or "auto" (follow the alert level above).
#   A separate axis because the OEM treats it as one - its own slider writes 1500 for
#   notifications and 1600 for touch, independently. And the two wants differ: alerts want
#   to be felt through a pocket, typing feedback wants not to be punishing in the hand.
#   There is no DURATION control anywhere to expose, which was checked rather than
#   assumed: dumping system, global and secure while moving the OEM slider shows only the
#   stepless keys change, and Android has no system-wide duration multiplier - it comes
#   from each effect's own waveform.
haptic_touch_strength=-1

# Ceiling of the OEM stepless scale that level 10 maps to.
#   2400 - the value the OEM's own slider produces at its top, so a value the vendor
#   service is known to accept. An earlier build used 2550 (255 amplitude x 10, which the
#   numbers seemed to suggest) and the vibration vanished completely at level 10 while
#   level 9 still worked: past its real maximum the service REJECTS the value rather than
#   clamping it. Overshooting costs the vibration, not a bit of headroom.
#   Range 500..2400. The apply script also reads each value back and steps down until one
#   sticks, so a rejected write ends up weaker rather than silent.
haptic_stepless_max=2400
# Audio processing profile: eq_compat|stock|hifi
#   Which side does the SOFTWARE processing. These are one axis, not three toggles:
#     eq_compat = UHQA off, af.resampler.quality=0. Hands the signal to an external
#                 EQ/ViPER untouched - forcing max resampling underneath one is exactly
#                 what breaks it. This is the safe default.
#     stock     = baseline only (hi-fi int_codec on, aec_ref off). No opinion either way.
#     hifi      = stock + UHQA on, hi-fi props, af.resampler.quality=255. Best when you
#                 are NOT running an external EQ. Pointless (and counter-productive)
#                 together with one.
#   Replaces the old AUDIO_EQ_COMPAT + property half of AUDIO_AGGRESSIVE, which were
#   direct opposites presented as two independent switches: with EQ compat on (the
#   default) the aggressive properties were silently dead code.
#   Applies without a reboot via WebUI "apply now" (restarts audioserver).
audio_profile=stock

# Hi-Fi DAC mixer tuning: 0|1
#   Headphone companders OFF and RX HPH Mode -> CLS_H_HIFI in the device's own mixer
#   files. This is CODEC configuration, not software processing, so it is a separate
#   axis from audio_profile and is safe to combine with eq_compat (it does not fight an
#   external EQ - it just gives it a cleaner DAC to work with).
#   Was the mixer half of AUDIO_AGGRESSIVE. Needs a reboot (overlay).
audio_dac_hifi=0
CAMERA_LEVEL=0

# Film grain: 0-6, 3 = stock (exactly 100%).
#   addNoiseWeight* is grain the camera puts BACK after denoising, because a perfectly
#   smooth image reads as plastic. Down for a cleaner look, up for more texture, 0 to
#   remove it entirely.
CAMERA_GRAIN=3

# Contrast and colour depth: 0-6, 3 = stock (exactly 100%).
#   The tone-mapping block's contrast and saturation scales. Separate from the camera
#   grade above, which works on the colour matrix - this shapes the curve, not the gamut.
#   0 flattens to 70%, 6 reaches 130%. An earlier build computed 70 + n*15, so the
#   documented neutral 3 actually applied 115% - a 15% push nobody asked for, on every
#   install, compounding on every reinstall. It is 70 + n*10 now, so 3 is truly neutral.
CAMERA_CONTRAST=3

# Portrait AI: 0-4, 0 = off (stock).
#   PersonBlendWeight, SkinBlendWeight and FaceBlendWeight ship at 0.0 - the neural pass
#   is simply off for faces. A ratio cannot move zero, so this writes absolute values,
#   and only inside the portrait sub-blocks. It only ever raises: where the device
#   already ships a higher weight than the level asks for, the device's value wins.
#   (It used to overwrite unconditionally, so level 1 turned a stock 0.7 into 0.15.)
CAMERA_PORTRAIT=0

# Macro and low-light sharpening: 0-4, 0 = follow the main sharpening.
#   MacroParams and LivehouseParams have their own scales, and these are the modes where
#   over-sharpening shows worst: close subjects and high ISO both amplify halos.
CAMERA_LOWLIGHT=0
CAMERA_AGGRESSIVE=0
CAMERA_AGGRESSIVE_INJECT=safe
smart_mode_enabled=0
smart_conf_low=350
smart_conf_high=650
smart_eff_obs_full=2000
smart_pkg_plaintext=0
smart_night_start_hour=0
smart_night_end_hour=6
smart_interactive_max=150
smart_idle_bias_min=-200
smart_idle_bias_max=200
smart_sleep_bias_max=1000
smart_net_conservative_max=1000
# smart_battery_bias: extra battery-lean nudge for Smart (x1000, 0=off).
# Raise toward economy (range 0-600); scaled by confidence, and the final lean
# is still hard-capped at pure-battery, so it shifts the lean without ever going
# past battery behaviour. Night/idle overrides still take precedence.
# Examples: 150 = mild, 300 = moderate, 500-600 = strong (can push active use
# into the deeper "behave like battery" economies on a confident learner).
smart_battery_bias=0
smart_debug_log=0
night_quiet_auto=1
night_quiet_auto_min_samples=3
charge_aware_enable=1
cool_gaming=1

# Media loudness: stock|mild|strong|max
#   Reshapes the audio-policy volume CURVES so every slider position is genuinely
#   louder. Stock OxygenOS attenuates hard across the usable range (media is -40 dB
#   at 20%, -17 dB at 60%), which is why the phone feels short of volume.
#     stock  = untouched.
#     mild   = ~+3.4 dB at 60%, ~+4 dB at 20%.
#     strong = ~+6 dB at 60%, ~+7 dB at 20%.
#     max    = ~+10 dB at 60%, ~+12 dB at 20%. This is as far as the curve can go and
#              still be provably safe: every point stays NEGATIVE (attenuation), so the
#              signal is only ever turned down from source level - clipping is not
#              arithmetically possible. The cost is range, not distortion: from 60% to
#              100% you now only have ~7 dB of travel, so the top of the slider gets
#              coarse. If it is still not loud enough at 100%, the curve is out of road
#              (0 dB = unity = the source itself) and you need dsp_loudness.
#   The boost is position-weighted: it ramps in over the first 40% of slider travel,
#   so the bottom of the range keeps stock levels (1% stays ~-58 dB) and quiet
#   listening still works, while the full lift lands where people actually listen.
#   Only the MUSIC curves are touched (speaker + headset/BT/earpiece). Alarms,
#   ringtones and notifications keep stock loudness. The 0 dB point at 100% is never
#   raised, so nothing clips - for real gain ABOVE unity use dsp_loudness below.
#   Needs a reboot.
media_loudness=stock

# ASB DSP loudness: off|1..25   (dB of makeup gain, limiter always on)
#   Ignored when audio_profile=eq_compat: that profile hands the stream to an
#   external engine (ViPER and friends), and our effect on the same output stops
#   that engine from seeing the stream at all, so the DSP is switched off there.
#   This is the gain stage the volume curves cannot provide: media_loudness can make
#   every slider position louder but can never exceed 0 dB at 100% (that is unity --
#   past it you only clip). dsp_loudness adds real gain ABOVE unity, with a
#   peak limiter (instant attack, ~120 ms release, -1 dBFS ceiling) so it cannot clip.
#   It is applied by libasbdsp.so, attached automatically to every music stream via
#   <postprocess> -- no companion app, so no "quiet until you open the EQ" problem.
#   A soft-knee compressor (3:1 above -18 dBFS) runs ahead of the gain, so the loudness
#   lands on the BODY of the track rather than being shaved off the peaks by the
#   limiter. Measured on dense material: the +6 setting delivers ~+5.9 dB RMS with the
#   compressor vs ~+5.0 dB without, at the same peak level. Tunable at runtime via
#   persist.asb.dsp.comp / .comp_ratio_x10 / .comp_thresh_mb (set comp=0 for the plain
#   gain+limiter chain).
#   off = effect not registered at all (zero overhead, zero risk).
#   Start at 3 and go up only if you want more. Past roughly 9 dB on already-loud
#   masters the limiter works hard and the result can sound squashed, and the top of
#   the range (25 dB) is there for genuinely quiet sources rather than as a target.
dsp_loudness=off


# DSP bass boost: off|1..10  (dB of low-shelf lift, needs dsp_loudness above)
#   A shelf at 90 Hz: the full lift lands on the low end, half of it at the corner, and
#   nothing above roughly 1 kHz - mids and vocals are untouched. It runs at the head of
#   the chain, before the compressor and the limiter, so the added low end is under the
#   same protection as everything else and cannot clip on its own.
#   The trade is headroom: every dB of bass makes the limiter engage sooner, so a large
#   boost combined with a high dsp_loudness will cost overall loudness. 3-6 is plenty on
#   most headphones; 10 is for genuinely bass-shy sources.
dsp_bass=off

# DSP compressor: on | off
#   On by default, and that is right for large gain: 6:1 above -24 dBFS holds the body
#   of a track down so the peaks stay clean. At +2..+4 dB it is the wrong trade - peaks
#   barely reach the ceiling anyway, so the compressor only squashes dynamics that never
#   needed it, which is what a careful listener hears as "processed".
#   Turning it off does NOT remove the true-peak limiter, so this cannot clip. At high
#   gain it makes the limiter work continuously instead of occasionally, which sounds
#   worse than the compressor did - so off is for modest gain, not for loud.
#   With dsp_loudness=off the whole effect is released and this setting does nothing.
dsp_compressor=on

# Which audio-effect build to install: auto | aidl | aidl_v2 | aidl_v3 | legacy
#   NOT a WebUI card. auto has been verified end to end on both interface versions and
#   needs no user involvement, and a setting nobody can meaningfully choose - whose wrong
#   value silently kills audio - does not belong in the interface. Kept here for
#   development and for a device the probe has not met yet.
#
#   What auto decides. The effect HAL is versioned, and the version is a property of the
#   VENDOR partition, frozen at the device's launch year under Treble/GRF - not of the
#   system image. A OnePlus 13 running Android 16 declares effect v2 because its vendor is
#   an Android 15 vintage; a OnePlus 15 declares v3. queryEffect() fills a Descriptor
#   through a plain C ABI call, so the struct layout has to match exactly: a v3-built
#   library on a v2 factory never gets as far as dlopen and reports set=-19 initCheck=-19
#   (NO_INIT) with everything else looking correct. auto reads the version out of the
#   VINTF manifest and stages the matching build.
#
#   legacy is for a device whose manifest declares a HIDL effect factory instead. It is
#   NOT a universal fallback: on an AIDL-only device a legacy library loads into the
#   service and no effect is ever created, which was measured rather than assumed.
#   Changing this takes effect on reinstall, or run
#   runtime/asb_dsp_abi_apply.sh <value> and reboot.
dsp_effect_abi=auto


# Bluetooth absolute volume: stock|disabled
#   stock    = absolute volume ON (default, recommended). The headset performs
#              the final attenuation and stays in sync with the phone slider:
#              loud, synced, no quiet-start.
#   disabled = absolute volume OFF. The phone applies its own software gain and
#              the headset keeps its own level. For car stereos / speakers that
#              are already too loud at step 1, or DSP setups that want the gain
#              stage on the phone. On modern headsets this often starts QUIET
#              after a reboot until an audio app re-inits the output.
# Legacy values are migrated automatically: auto/off -> stock, on -> disabled.
bt_absvol_mode=stock

# Bluetooth A2DP hardware offload: on|off|auto
#   on   = keep A2DP offloaded to the DSP (stock, best battery/codec efficiency).
#          BUT audio effect engines (ViPER4Android, JamesDSP, etc.) CANNOT process
#          Bluetooth audio while it is offloaded — the stream bypasses the effect
#          chain in the DSP. With such an effect installed this can make BT start
#          quiet after every connect until the effect app is opened (which forces
#          a non-offload re-open).
#   off  = disable A2DP offload -> Bluetooth audio goes through the software path,
#          so effect engines process it from the first connect and volume is
#          correct immediately (no need to open the effect app). Costs some CPU/
#          battery on BT playback. Use this if you run ViPER4Android on Bluetooth.
#   auto = do not touch the offload props (leave the ROM / other modules' choice).
bt_a2dp_offload=on

# Region: allow system locale as a last-resort source for Wi-Fi country code
# when no SIM/operator country is available. 0=off (safest), 1=allow locale.
region_allow_locale=0
charge_assist_alpha_max=450
charge_temp_warn_dC=390
charge_temp_hot_dC=415
# GPU idle-trim: in light non-video states (LIGHT_IDLE/MODERATE, not gaming,
# not thermal-capped) shave the GPU ceiling by this % to save the GPU rail,
# never dropping below the floor. Tuned up from 8 to 12 after full-day logs
# showed GPU busy at 0% for ~77% of screen-on time on OP15 — plenty of slack.
# Only bites profiles whose GPU ceiling sits above floor+trim (balanced/smart);
# battery already runs a low GPU cap so the floor guard leaves it untouched.
gpu_idle_trim_pct=12
gpu_idle_trim_floor=55
gpu_video_busy_min=40

# --- Device-adaptive bounds (Phase 2) ---
# 0 = governor uses its compiled-in OP15 bounds (default, what ships).
# 1 = governor loads per-device bounds from /data/adb/asb/device_bounds.env,
#     synthesised at install/boot by scaling the OP15 reference ratios onto this
#     device's real frequencies. On OP15 the synthesised values equal the
#     compiled ones, so enabling this changes nothing on the reference device.
#     Malformed/missing file or an inverted invariant -> silent fallback to
#     compiled defaults. Opt-in while the derivation is validated on more devices.
device_bounds_override=1
