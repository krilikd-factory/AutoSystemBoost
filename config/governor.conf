gaming_gpu_exit=45
sustained_gpu_exit=35
# SUSTAINED sits BELOW heavy (0.72) on the cap ladder, not above it.
#   This state is entered on temperature, so a level above HEAVY meant overheating
#   raised the ceiling instead of lowering it. Measured over a full day: SUSTAINED
#   drew 739 mA at 63 C against HEAVY's 331 mA at 44 C on the same load - more than
#   GAMING - and held 24% of screen-on time while the vendor thermal HAL never
#   clamped once. 0.62 is the value the performance profile already used.
#   Raise it toward 0.72 if sustained workloads feel too conservative.
sustained_level=0.62
heavy_min_dwell_s=8
sustained_min_dwell_s=24
gaming_min_dwell_s=25
reassert_heavy_s=12
reassert_gaming_s=6
msm_perf_boost_only=1
thermal_overlay_pct=18
thermal_throttle_temp=60
# --- Skin-anchored thermal decision (V59.1) ------------------------------------
# The cpu_max (junction) sensor sits at 85-95C under ANY real load, so throttling/
# vetoing on it alone false-fires during normal bursts and defeats race-to-idle
# (worse heat AND drain). When a shell/skin sensor is present ASB instead decides
# on user-facing heat, falling back to the junction gate (thermal_throttle_temp /
# veto=65) when no skin sensor exists.
#   thermal_skin_gate=1        1=use skin when present, 0=old junction-only behaviour
#   thermal_skin_c=47          skin temp (C) that engages the comfort throttle/veto
#   thermal_junction_hard_c=95 junction hard-limit (C) that always throttles (silicon guard)
thermal_skin_gate=1
thermal_skin_c=47
thermal_junction_hard_c=95
# --- Gaming CPU ceiling ---------------------------------------------------------
# During the GAMING state the smart curve can request up to ~3 GHz, but the vendor
# PowerHAL clamps the real clock to ~2.2 GHz anyway — the extra request buys no FPS
# and only causes brief high-voltage OPP excursions (more heat + drain). This caps
# the DECLARED scaling_max in gaming so ASB never asks higher than the vendor holds.
# 0 = disabled. Default 2400000 (2.4 GHz) sits just above the vendor's gaming settle.
gaming_cpu_max_ceiling_khz=2400000

# Camera hold: keep interactive caps while the camera pipeline streams.
#   The load classifier reads GPU busy and the 1-minute loadavg, and a camera
#   capture lights up neither - the ISP and the hardware encoder do the work.
#   So the state machine sat in MODERATE while a 4K60 recording was missing its
#   16.6 ms frame deadline against battery-shaped caps. Reported from the field
#   as jerky 4K60 capture and playback that cleared the instant the CPU, memory
#   and scheduler tweaks were removed.
#   While the hold is active ASB also restores the foreground/top-app cpuset to
#   every core, lifts the uclamp.max ceilings the camera HAL sits under, and
#   eases swappiness - then puts each of them back exactly as it found them.
#   Thermal protection is unchanged: only the SOFT battery lean is overridden,
#   the junction hard-limit and the writer's thermal cap still throttle.
#   0 = off (behaviour identical to V59 and earlier).
camera_hold_enable=1

# What counts as "the camera is streaming": CPU% of one core burned by the
#   camera HAL provider process. 15 catches preview and recording while
#   ignoring an idle provider. Raise it if the hold engages when it should not.
camera_busy_pct=15

# How long the hold stays after the pipeline goes quiet, in seconds. This
#   covers the gap between stopping a recording and the file being finalised,
#   and stops the caps oscillating between shots.
camera_hold_grace_s=20
gaming_gap_thresh=1650000
gaming_gap_ticks=5
auto_degrade_thermal_pct=45
gaming_retry_cooldown_s=18
gaming_retry_temp_max=50
sustained_reentry_cooldown_s=24
highload_mode=stable
moderate_load_enter=14.0
log_level=0
bat_heavy_load_enter=20.0
bat_moderate_load_enter=14.0
bat_suppress_gaming=1
bat_fast_idle_s=12
bat_light_idle_gpu=10
env_iq_quiet=28
