# AutoSystemBoost — feature toggles
#
# Active features: applied at runtime by service.sh / post-fs-data.sh,
# gated via `asb_feature_enabled <NAME>`.
#
# INERT features: declared so the installer remembers user choices across
# upgrades, but with no runtime path yet. asb_lint.sh DERIVES this list by
# looking for an asb_feature_enabled gate or an "# ASB:<NAME>:BEGIN" block,
# rather than trusting a comment here - the four entries below used to be
# labelled reserved while all four were in fact wired, and the one that
# genuinely does nothing was not labelled at all.
# Generic-safe defaults. Any vendor/system property mutation requires an exact
# fingerprint-validated device pack with domain=properties. The bundled AIDL/legacy
# DSP effect is capability-selected by the installer and user-controlled by its own
# settings, so it remains available on compatible generic devices. Camera, carrier/
# network changes, destructive log suppression and vendor overlays stay opt-in.
AUDIO=1
BT=0
NFC=1
CAMERA=0
MEDIA=1
CPU=1
VM=1
NET=0
WIFI=1
GPS=1
KERNEL=0
LOG=0
LPM=1           # modem low-power policy (runtime/asb_lpm.sh, driven by FSM state)
RADIO_IMS=1     # managed property block; requires domain=properties
DISPLAY=1       # managed property block; requires domain=properties
FPS=1           # managed property block + gates asb_apply_ux
SECURITY=1      # managed property block; requires domain=properties
BG_TRIM=0
VENDOR_OVERLAY=0  # enable only for a fingerprint-validated device pack
SOTER_REPAIR=0
